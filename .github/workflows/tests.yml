name: Tests

# Plain pytest on every push/PR — includes the contract tests
# (tests/test_contract.py), which compare demonTD's wire surface against
# the vendored DEMON contract (vendor/demon_contract.json). This check
# is what makes the nightly contract-sync PR's status meaningful.

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy pytest

      - name: pytest
        run: PYTHONPATH=src python3 -m pytest tests/ -q
